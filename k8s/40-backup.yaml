apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: backup-data
  namespace: biblio
spec:
  accessModes: [ReadWriteOnce]
  resources: 
    requests: 
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob 
metadata:
  name: db-backup
  namespace: biblio
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: dump
            image: mysql:8.4
            env: 
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            command: ["sh", "-c"]
            args:
            - |
              set -e 
              F=/backup/library-$(date +%Y%m%d-%H%M%S).sql
              mysqldump -h db -u library --single-transaction --no-tablespaces library > "$F.tmp"
              mv "$F.tmp" "$F"
              echo "sauvegarde OK : $F ($(wc -c < "$F") octets)"
              ls -t /backup/*.sql | tail -n +11 | while read -r old; do rm -f "$old"; done
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: backup-data