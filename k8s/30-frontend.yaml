apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend
  namespace: biblio
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: frontend
  template: 
    metadata:
      labels: 
        app: frontend
    spec: 
      containers:
      - name: frontend
        image: biblio-frontend:1
        imagePullPolicy: Never
        ports: 
        - containerPort: 80
        readinessProbe:
          httpGet: 
            path: /
            port: 80
          periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits: 
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata: 
  name: frontend
  namespace: biblio
spec:
  type: NodePort
  selector:
    app: frontend
  ports: 
  - port: 80
    targetPort: 80
    nodePort: 30080
