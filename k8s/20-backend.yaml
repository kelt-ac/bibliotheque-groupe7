apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: biblio
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z db 3306; do echo "attente de db..."; sleep 2; done 
      containers:
      - name: backend
        image: biblio-backend:1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config
        env: 
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: "true"
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits: 
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: biblio
spec:
  selector:
    app: backend
  ports:
  - port: 8080