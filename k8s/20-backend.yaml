
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: biblio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z db 3306; do echo "attente de db..."; sleep 2; done

      containers:
        - name: backend
          image: biblio-backend:2
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: app-config

          env:
            - name: DB_URL 
              value: DB_URL:jdbc:mysql://db:3306/library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password

            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: jwt-secret

            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: admin-password

            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: "true"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: biblio
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
