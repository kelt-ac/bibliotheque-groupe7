apiVersion: v1
kind: PersistentVolumeClaim
metadata: 
  name: db-data
  namespace: biblio
spec: 
  accessModes: [ReadWriteOnce]
  resources:
    requests: 
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: db
  namespace: biblio
spec: 
  replicas: 1
  strategy: 
    type: Recreate
  selector: 
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: mysql
        image: mysql:8.4
        args: 
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        ports: 
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: library
        - name: MYSQL_USER
          value: library
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: root-password
        readinessProbe:
          exec: 
            command:
            - sh
            - -c
            - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
---
apiVersion: v1
kind: Service 
metadata: 
  name: db
  namespace: biblio
spec:
  selector:
    app: db
  ports:
  - port: 3306