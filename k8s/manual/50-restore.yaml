apiVersion: batch/v1
kind: Job 
metadata: 
  name: db-restore
  namespace: biblio 
spec: 
  backoffLimit: 0
  template: 
    spec:
      restartPolicy: Never
      containers: 
      - name: restore 
        image: mysql:8.4
        env: 
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: BACKUP_FILE
          value: ""
        command: ["sh", "-c"]
        args:
        - |
          set -e 
          if [ -n "$BACKUP_FILE" ]; then
            f="/backup/$BACKUP_FILE"
          else 
            f=$(ls -t /backup/*.sql | head -1)
          fi 
          [ -s "$f" ] || { echo "ERREUR : fichier absent ou vide : $f"; exit 1; }
          echo "restauration de $f"
          mysql -h db -u library library < "$f"
          echo "restauration terminee"
        volumeMounts:
        - name: backup
          mountPath: /backup
      volumes:
      - name: backup
        persistentVolumeClaim:
          claimName: backup-data