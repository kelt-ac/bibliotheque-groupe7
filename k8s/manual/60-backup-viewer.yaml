apiVersion: v1
kind: Pod 
metadata: 
  name: backup-viewer
  namespace: biblio 
spec:
  containers:
  - name: viewer 
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: backup
      mountPath: /backup
  volumes: 
  - name: backup
    persistentVolumeClaim:
      claimName: backup-data