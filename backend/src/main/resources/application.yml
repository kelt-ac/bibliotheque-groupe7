spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://db:3306/library?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:library}
    password: ${DB_PASSWORD:library}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
app:
  max-loans: 3        # limite d'emprunts par lecteur
  loan-days: 14       # durée d'un emprunt
management:
  endpoints.web.exposure.include: health
